name: Website

# A fork has neither the Cloudflare secrets nor the Pages setup, so both jobs check the repository.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-progress deploy: cancelling a live deploy-pages run corrupts the deployment.
concurrency:
  group: website
  cancel-in-progress: false

jobs:
  cloudflare:
    if: github.repository == 'abue-ammar/tinycast'
    runs-on: ubuntu-latest
    environment:
      name: cloudflare
      url: https://tinycast.dev/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install
        working-directory: website
        run: npm install
      # The token lifts the build's GitHub API lookups off the runner IP's anonymous limit.
      - name: Build
        working-directory: website
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build
      - name: Deploy to Cloudflare
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
        run: |
          secrets="$RUNNER_TEMP/worker-secrets.json"
          jq -n '{POLAR_ACCESS_TOKEN: env.POLAR_ACCESS_TOKEN}' > "$secrets"
          npm run deploy -- --secrets-file "$secrets"

  # Only a CNAME, so GitHub 301s the old Pages URL; separate so a failed deploy can't break it.
  redirect:
    if: github.repository == 'abue-ammar/tinycast'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/redirect
      - id: deployment
        uses: actions/deploy-pages@v5
